<div class="drawer lg:drawer-open">
  <input id="my-drawer" type="checkbox" class="drawer-toggle" />

  <!-- MAIN CONTENT -->
  <div class="drawer-content flex flex-col bg-slate-800 text-slate-300 min-h-screen">
    <!-- TOGGLE BUTTON (only visible on mobile) -->
    <label for="my-drawer" class="btn btn-primary drawer-button lg:hidden m-4 w-fit">☰ Menu</label>

    <!-- Router outlet -->
    <div class="px-4 pt-2">
      <router-outlet></router-outlet>
    </div>
  </div>

  <!-- SIDEBAR -->
  <div class="drawer-side">
    <label for="my-drawer" class="drawer-overlay"></label>
    <aside class="menu p-4 w-64 min-h-full bg-gray-900 text-slate-300">
      <!-- LOGO -->
      <div id="logo" class="mb-6">
        <h1 routerLink="/" class="text-2xl font-bold text-white font-['comfortaa'] cursor-pointer">Teslo<span class="text-blue-500"> | Shop</span></h1>
        <p class="text-slate-500 text-sm">Manage your actions and activities</p>
      </div>

      <!-- PROFILE -->
      <div id="profile" class="mb-8">
        <p class="text-slate-500 font-['comfortaa']">Welcome back,</p>
        <a href="#" class="inline-flex space-x-2 items-center mt-2">
          <img class="rounded-full w-8 h-8" src="https://images.unsplash.com/photo-1542909168-82c3e7fdca5c?...">
          <span class="text-sm font-bold">{{ user()?.fullName }}</span>
        </a>
      </div>

      <!-- NAVIGATION -->
      <ul>
        <li>
          <a routerLink="/admin/dashboard" routerLinkActive="bg-blue-800" class="py-2 px-3 rounded hover:bg-white/5 flex items-center space-x-2">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="1.5">...</svg>
            <span class="text-lg">Dashboard</span>
          </a>
        </li>
        <li>
          <a routerLink="/admin/products" routerLinkActive="bg-blue-800" class="py-2 px-3 rounded hover:bg-white/5 flex items-center space-x-2">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="1.5">...</svg>
            <span class="text-lg">Products</span>
          </a>
        </li>
      </ul>

      <!-- LOGOUT -->
      <div class="mt-4">
        <button (click)="authService.logout()" class="btn btn-error w-full">Logout</button>
      </div>
    </aside>
  </div>
</div>
